version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cinesync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # TURN relay for WebRTC calls behind strict NATs. Start with: docker compose --profile turn up -d
  # Then set on the API: TURN_URLS=turn:<public-host>:3478 and TURN_SECRET=<same secret as below>.
  # On a server, set EXTERNAL_IP to its public address and open 3478/udp+tcp and 49160-49200/udp.
  turn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: always
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me}
      - --realm=watchtogether
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --external-ip=${EXTERNAL_IP:-127.0.0.1}
      # Don't let the relay be used to reach private networks.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  postgres_data:
